name: Capture live site
on:
  push:
    branches: [capture-live]
    paths: [.github/workflows/capture-live.yml, .github/scripts/capture.mjs]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/capture.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Snapshot of the live site's files" || echo "no changes"
          git push origin HEAD:capture-live-result
